# Configuración del scanner SonarQube (SonarQube Cloud o self-hosted).
# El host, el token y la organización (solo Cloud) llegan por entorno o -D
# (SONAR_HOST_URL / SONAR_TOKEN / SONAR_ORGANIZATION), nunca por este archivo.
# En CI, SONAR_PROJECT_KEY reemplaza el projectKey de abajo (en Cloud suele ser <organizacion>_pms-hotel-mobile).
# Ver docs/CI-CD.md.
sonar.projectKey=pms-hotel-mobile
sonar.projectName=PMS Hotel Boutique Mobile
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=scripts
sonar.test.inclusions=scripts/test-*.ts
sonar.exclusions=node_modules/**,coverage/**,dist/**,.expo/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# La cobertura se mide sobre la lógica (services, mappers, models, utils, constants).
# Pantallas, componentes visuales, navegación y datos de demostración no tienen pruebas
# unitarias; se excluyen solo del cálculo de cobertura (siguen analizándose para bugs,
# vulnerabilidades, code smells y duplicación).
sonar.coverage.exclusions=src/**/screens/**,src/**/components/**,src/navigation/**,src/**/context/**,src/data/**,src/shared/theme/**,src/**/dtos/**
