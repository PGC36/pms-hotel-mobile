# Builds nativos con Expo EAS (equivalente en Jenkins: etapas "EAS build" del Jenkinsfile).
# Ver docs/CI-CD.md.
#
# Los builds nativos consumen la cuota mensual de EAS, así que solo se generan cuando se piden:
#
# - Merge a develop de un PR con la etiqueta "build" -> perfil "preview": APK Android instalable.
#   Sin la etiqueta no se genera nada (para revisar cambios basta Expo Go con `npx expo start`).
# - Tag vX.Y.Z           -> perfil "production": AAB Android firmado + build de simulador iOS,
#                           adjuntos a un GitHub Release. NO se publica en tiendas.
# - workflow_dispatch    -> perfil a elección; iOS (simulador) opcional.
#
# Antes de cada build corre la validación completa (ci.yml). Si falta EXPO_TOKEN o el proyecto no
# está vinculado a EAS (extra.eas.projectId en app.json), los builds se omiten con un aviso.
name: Mobile EAS Build

on:
  push:
    branches: [develop]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de eas.json
        type: choice
        options: [preview, production]
        default: preview
      ios:
        description: Incluir build de simulador iOS
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read # leer las etiquetas del PR mergeado

concurrency:
  group: mobile-eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Decidir build, perfil y prerequisitos
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.decide.outputs.profile }}
      version: ${{ steps.decide.outputs.version }}
      platforms: ${{ steps.decide.outputs.platforms }}
      enabled: ${{ steps.prereq.outputs.enabled == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Perfil, versión y plataformas
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_IOS: ${{ inputs.ios }}
        run: |
          version=$(node -p "require('./app.json').expo.version")
          platforms='["android"]'
          requested=true
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            profile=production
            platforms='["android","ios"]'
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error title=Versión inconsistente::El tag $GITHUB_REF_NAME no coincide con expo.version=$version de app.json. Actualiza app.json en main antes de etiquetar."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            profile="$INPUT_PROFILE"
            if [ "$INPUT_IOS" = "true" ]; then platforms='["android","ios"]'; fi
          else
            # Push a develop: solo hay build si el PR mergeado tiene la etiqueta "build".
            profile=preview
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[0] // empty | "\(.number) \(any(.labels[]; .name == "build"))"')
            if [ -z "$pr" ]; then
              requested=false
              reason="el push a develop no viene de un PR"
            elif [ "${pr#* }" != "true" ]; then
              requested=false
              reason="el PR #${pr%% *} no tiene la etiqueta \"build\""
            else
              echo "PR #${pr%% *} con etiqueta \"build\": se genera el preview."
            fi
          fi
          if [ "$requested" = "false" ]; then
            echo "::notice title=EAS build no solicitado::Sin build: ${reason}. Para generarlo, agrega la etiqueta \"build\" al PR antes de mergear o lánzalo a mano (Actions → Mobile EAS Build → Run workflow)."
            echo "## EAS build no solicitado" >> "$GITHUB_STEP_SUMMARY"
            echo "Sin build: ${reason}. No se consumió cuota de EAS." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "requested=$requested" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "Perfil: $profile — versión visible: $version — plataformas: $platforms — solicitado: $requested"

      - name: Verificar EXPO_TOKEN y proyecto EAS
        id: prereq
        if: steps.decide.outputs.requested == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=EAS build omitido::EXPO_TOKEN no está configurado. No se generó ningún build."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$(node -p "require('./app.json').expo.extra?.eas?.projectId ?? ''")" ]; then
            echo "::notice title=EAS build omitido::app.json no tiene extra.eas.projectId. Ejecuta 'npx eas-cli init' y commitea app.json."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  validate:
    name: Validación
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: EAS ${{ needs.resolve.outputs.profile }} (${{ matrix.platform }})
    needs: [resolve, validate]
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.resolve.outputs.platforms) }}
    env:
      PROFILE: ${{ needs.resolve.outputs.profile }}
      VERSION: ${{ needs.resolve.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: eas build
        id: eas
        run: |
          eas_profile="$PROFILE"
          # Sin cuenta Apple Developer no hay firma iOS: la release de iOS es build de simulador.
          if [ "$PLATFORM" = "ios" ] && [ "$PROFILE" = "production" ]; then
            eas_profile=production-simulator
          fi
          eas build --platform "$PLATFORM" --profile "$eas_profile" \
            --non-interactive --wait --json > eas-build.json
          node -e '
            const [b] = require("./eas-build.json");
            const url = b.artifacts.buildUrl;
            const file = url.split("?")[0].split("/").pop();
            const ext = file.includes(".") ? file.slice(file.indexOf(".") + 1) : "bin";
            console.log(`url=${url}`);
            console.log(`ext=${ext}`);
            console.log(`id=${b.id}`);
            console.log(`buildNumber=${b.appBuildVersion ?? ""}`);
          ' >> "$GITHUB_OUTPUT"
          echo "eas_profile=$eas_profile" >> "$GITHUB_OUTPUT"

      - name: Descargar artefacto
        env:
          URL: ${{ steps.eas.outputs.url }}
          EXT: ${{ steps.eas.outputs.ext }}
        run: |
          mkdir -p artifact
          curl -fsSL -o "artifact/pms-hotel-mobile-${VERSION}-${PROFILE}-${PLATFORM}.${EXT}" "$URL"
          ls -la artifact

      - name: Conservar artefacto para QA
        uses: actions/upload-artifact@v4
        with:
          name: eas-${{ env.PROFILE }}-${{ env.PLATFORM }}
          path: artifact/
          retention-days: 30

      - name: Resumen
        env:
          URL: ${{ steps.eas.outputs.url }}
          BUILD_ID: ${{ steps.eas.outputs.id }}
          BUILD_NUMBER: ${{ steps.eas.outputs.buildNumber }}
          EAS_PROFILE: ${{ steps.eas.outputs.eas_profile }}
        run: |
          {
            echo "## EAS ${EAS_PROFILE} — ${PLATFORM}"
            echo ""
            echo "- Versión: \`${VERSION}\` (build \`${BUILD_NUMBER}\`)"
            echo "- Build EAS: \`${BUILD_ID}\`"
            echo "- Descarga directa (EAS): ${URL}"
            echo "- También disponible como artefacto de este run: \`eas-${PROFILE}-${PLATFORM}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release (sin publicar en tiendas)
    needs: [resolve, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          pattern: eas-production-*
          path: release
          merge-multiple: true

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mobile $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Builds EAS del perfil production. Android: AAB firmado con el keystore administrado por EAS. iOS: build de simulador (no hay cuenta Apple Developer). No se publicó en App Store ni Play Store."
